[package]
name = "tfl"
version = "0.1.0"
edition = "2021"
authors = ["TFL Contributors"]
description = "Modern, high-performance TUI for local LLM inference and host hardware monitoring (llama.cpp, vLLM, AMD ROCm, NVIDIA NVML, CPU)"
license = "MIT OR Apache-2.0"
readme = "README.md"

[lib]
name = "tfl"
path = "src/lib.rs"

[[bin]]
name = "tfl"
path = "src/main.rs"

[dependencies]
# TUI and Terminal
ratatui = "0.30.2"
crossterm = { version = "0.28.1", features = ["event-stream"] }

# Async runtime & Networking
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hardware and System Inspection
sysinfo = "0.33"

# CLI & Configuration
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
anyhow = "1.0"
thiserror = "2.0"

# Logging (file-based to avoid polluting TUI)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
